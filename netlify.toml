[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Red de seguridad: si el despliegue es manual y no se lee la ruta declarada
# dentro de la función, esta reescritura mantiene /api/sala funcionando igual.
[[redirects]]
  from = "/api/sala"
  to = "/.netlify/functions/sala"
  status = 200
  force = true
